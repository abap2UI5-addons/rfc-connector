name: abap-standard

on:
  push:
    branches: [main]
  pull_request:
  # the abap2UI5 core is resolved from its main branch with no version pin, so
  # a rename upstream breaks this repository silently. Nothing else notices
  # while there is no pull request open.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abap-standard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abap-standard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npx abaplint ./abaplint.jsonc
